# CD на self-hosted runner внутри Ubuntu VM (см. ../06-cd-avtodeploy.md)
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    steps:
      - name: Pull and restart compose
        run: |
          set -euo pipefail
          APP_DIR="${HOME}/apps/devops-lab-api"
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "Каталог $APP_DIR не найден. Сначала Этап 4 (ручной clone)."
            exit 1
          fi
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker compose ps
          curl -fsS http://127.0.0.1:3000/health
